<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QRPatch · Browser QA</title>
<style>body{font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6fb;color:#18243b;margin:0;padding:24px}main{max-width:1440px;margin:auto}h1{margin:0 0 6px;font-size:24px}p{margin:4px 0 18px;color:#65748e}.panel{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.metric{padding:10px 16px;background:white;border:1px solid #e5e9f2;border-radius:9px;font-weight:700}#log{padding:14px;background:#fff;border:1px solid #e5e9f2;border-radius:12px;margin:0 0 16px;min-height:200px}.pass{color:#087a50}.fail{color:#c43932}.skip{color:#8d6b1d}.entry{padding:4px;border-bottom:1px solid #f1f3f7}iframe{display:block;width:100%;height:830px;border:1px solid #e5e9f2;border-radius:14px;background:#fff}code{font-size:12px;background:#e9eef8;padding:2px 5px;border-radius:4px}</style></head>
<body><main><h1>QRPatch · 浏览器端到端自检</h1><p>基于实际编辑器页面执行：示例画布、素材上传、两种缩放模式、拖拽和 PNG 导出。测试图片仅在当前浏览器内存中生成。</p><div class="panel"><span id="summary" class="metric">正在启动测试…</span><span id="build" class="metric">独立测试入口</span><a class="metric" href="../index.html">返回编辑器 ↗</a></div><div id="log" aria-live="polite"></div><iframe id="app" title="QRPatch 实际编辑器" src="../index.html?qa=1"></iframe></main>
<script>
(async()=>{
const entries=[],logger=document.querySelector("#log");
let pass=0,fail=0,skip=0;
function say(status,title,details=""){entries.push({status,title,details});const el=document.createElement("div");el.className="entry "+status;el.textContent=(status==="pass"?"✓ ":status==="fail"?"✗ ":"– ")+title+(details?" — "+details:"");logger.append(el);document.querySelector("#summary").textContent=pass+" 通过 / "+fail+" 失败 / "+skip+" 跳过"}
function eq(actual,expected,tag){if(actual!==expected)throw Error(tag+": expected "+expected+" got "+actual)}
function near(a,b,tag){if(Math.abs(a-b)>1.5)throw Error(tag+": "+a+" vs "+b)}
async function check(title,fn){try{const msg=await fn();pass++;say("pass",title,msg||"")}catch(e){fail++;say("fail",title,String(e.message||e))}}
const nap=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,limit=12000){const started=Date.now();while(Date.now()-started<limit){if(fn())return;await nap(80)}throw Error("等待浏览器状态超时")}
const frame=document.querySelector("#app");await new Promise((r,reject)=>{frame.onload=r;frame.onerror=()=>reject(Error("编辑器加载失败"))});
const w=frame.contentWindow,d=frame.contentDocument,el=id=>d.getElementById(id),state=()=>w.QRPatchQA.snapshot(),layer=()=>state().layers.find(l=>l.id===state().selected);
document.querySelector("#build").textContent="Editor / "+d.title;
await check("编辑器初始化与浏览器 QA 接口",()=>{if(!w.QRPatchQA)throw Error("qa snapshot unavailable");if(!el("canvas")||!el("assetInput"))throw Error("missing editor nodes")});
await check("真实示例画布可加载",async()=>{el("demo").click();await until(()=>state().background&&state().layers.length===1);eq(state().background.width,1000,"poster pixel width");eq(state().background.height,700,"poster pixel height")});
await check("选中图层出现浮动工具条",()=>{if(el("quickTools").hidden)throw Error("floating toolbar hidden");if(!el("quickMove")||!el("quickCrop")||!el("quickZoomIn"))throw Error("missing tools")});
function qrBlob(){const encoded="AAAAAAAAAAAAAAAAAAAA/hv4BBUQQC6uugF1RdALo66AQQUEA/qv4AAfAACCrnAFq1zAI72OAFIMkAt0UwAAbOAD+CFAEE9OALppMAXRbAAuke4BBILQD+seAAAAAAAAAAAAAAAAAAAAAA==";const raw=atob(encoded),cv=d.createElement("canvas");cv.width=cv.height=290;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,290,290);g.fillStyle="#000";for(let n=0;n<29*29;n++){const v=raw.charCodeAt(n>>3),bit=(v>>(7-(n%8)))&1;if(bit)g.fillRect((n%29)*10,Math.floor(n/29)*10,10,10)}return new Promise(r=>cv.toBlob(r,"image/png"))}
let qr;
async function uploadQR(name){const blob=await qrBlob(),file=new w.File([blob],name,{type:"image/png"}),dt=new w.DataTransfer();dt.items.add(file);el("assetInput").files=dt.files;el("assetInput").dispatchEvent(new w.Event("change",{bubbles:true}));const n=state().layers.length;await until(()=>state().layers.length===n+1);return layer()}
await check("上传真实二维码测试素材",async()=>{qr=await uploadQR("qr-test-code.png");eq(qr.kind,"qr","QR kind");if(!qr.visible&&qr.visible!==undefined)throw Error("QR hidden")});
await check("QR 裁切初始化保持白边、不被强行铺满",()=>{el("quickCrop").click();let l=layer();if(!state().cropMode)throw Error("crop mode not enabled");if(!l.imageRect)throw Error("image rectangle missing");const safe=l.w*(1-2*(l.padding||0)/100);if(l.imageRect.w>safe+1||l.imageRect.h>l.h*(1-2*(l.padding||0)/100)+1)throw Error("QR image expanded beyond quiet-zone area");return "QR image remains contained"});
await check("裁切模式：图片缩放不改变蒙版",()=>{let before=layer(),rect={...before.imageRect};el("quickZoomIn").click();let after=layer();eq(Math.round(after.imageZoom*100),115,"image zoom");eq(after.w,before.w,"mask width");eq(after.h,before.h,"mask height");near(after.imageRect.w,rect.w*1.15,"image width ×1.15");near(after.imageRect.h,rect.h*1.15,"image height ×1.15")});
await check("裁切模式：调整蒙版不会修改图片大小",()=>{const before=layer(),value=el("propW");value.value=Math.round(before.w*.8);value.dispatchEvent(new w.Event("change",{bubbles:true}));const after=layer();if(after.w>=before.w)throw Error("mask did not shrink");eq(after.imageRect.w,before.imageRect.w,"source width");eq(after.imageRect.h,before.imageRect.h,"source height")});
function drag(from,to){const stage=el("stage"),canvas=el("canvas"),bounds=canvas.getBoundingClientRect();stage.setPointerCapture=()=>{};stage.releasePointerCapture=()=>{};const bg=state().background;const mk=(name,p)=>new w.PointerEvent(name,{bubbles:true,pointerId:18,isPrimary:true,pointerType:"mouse",clientX:bounds.left+p.x*bounds.width/bg.width,clientY:bounds.top+p.y*bounds.height/bg.height,buttons:name==="pointerup"?0:1});stage.dispatchEvent(mk("pointerdown",from));stage.dispatchEvent(mk("pointermove",to));stage.dispatchEvent(mk("pointerup",to))}
await check("裁切模式：拖动图片内容时蒙版不动",()=>{const before=layer(),from={x:before.x+before.w*.5,y:before.y+before.h*.5};drag(from,{x:from.x+18,y:from.y+12});const after=layer();eq(after.x,before.x,"mask x");eq(after.y,before.y,"mask y");near(after.imageRect.x,before.imageRect.x+18,"source x moved");near(after.imageRect.y,before.imageRect.y+12,"source y moved")});
await check("整体模式：再次缩放时图片与蒙版同比缩放",()=>{el("quickMove").click();const before=layer(),value=el("propW"),newW=Math.round(before.w*1.25);value.value=newW;value.dispatchEvent(new w.Event("change",{bubbles:true}));const after=layer();if(state().cropMode)throw Error("still crop mode");const r=after.w/before.w;near(after.imageRect.w,before.imageRect.w*r,"image width scales with mask");near(after.imageRect.h,before.imageRect.h*r,"image height scales with mask")});
await check("整体模式：四角拖拽让图片与蒙版一起变化",()=>{const b=layer();drag({x:b.x+b.w,y:b.y+b.h},{x:b.x+b.w+18,y:b.y+b.h+18});const a=layer();if(a.w===b.w)throw Error("frame handle not resized");near(a.imageRect.w/b.imageRect.w,a.w/b.w,"image scales with dragged mask")});
await check("整体模式：拖动图层时图片同步位移",()=>{const b=layer(),p={x:b.x+b.w*.5,y:b.y+b.h*.5};drag(p,{x:p.x+18,y:p.y+12});const a=layer();near(a.imageRect.x-b.imageRect.x,a.x-b.x,"image follows layer x");near(a.imageRect.y-b.imageRect.y,a.y-b.y,"image follows layer y")});
let savedPNG=null;
await check("原始分辨率 PNG 导出",async()=>{const orig=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=function(blob){if(blob?.type==="image/png")savedPNG=blob;return orig(blob)};el("export").click();await until(()=>savedPNG);const im=await w.createImageBitmap(savedPNG);eq(im.width,1000,"export width");eq(im.height,700,"export height");im.close();return "PNG 1000 × 700"});
let qrOutput=null,qrLayer=null;
await check("导出的二维码矩阵保真（29 × 29 个模块）",async()=>{
  qrLayer=await uploadQR("qr-check-code.png");
  const sourceQR=qrLayer;
  savedPNG=null;
  el("export").click();
  await until(()=>savedPNG);
  qrOutput=savedPNG;
  const bitmap=await w.createImageBitmap(qrOutput),out=d.createElement("canvas");
  out.width=bitmap.width;out.height=bitmap.height;
  const g=out.getContext("2d",{willReadFrequently:true});g.drawImage(bitmap,0,0);bitmap.close();
  const padding=sourceQR.backing?sourceQR.padding/100:0;
  const inner={x:sourceQR.x+sourceQR.w*padding,y:sourceQR.y+sourceQR.h*padding,
    w:sourceQR.w*(1-2*padding),h:sourceQR.h*(1-2*padding)};
  const side=Math.min(inner.w,inner.h);
  const x0=inner.x+(inner.w-side)/2,y0=inner.y+(inner.h-side)/2;
  const encoded="AAAAAAAAAAAAAAAAAAAA/hv4BBUQQC6uugF1RdALo66AQQUEA/qv4AAfAACCrnAFq1zAI72OAFIMkAt0UwAAbOAD+CFAEE9OALppMAXRbAAuke4BBILQD+seAAAAAAAAAAAAAAAAAAAAAA==";
  const raw=atob(encoded);let errors=0;
  for(let n=0;n<29*29;n++){
    const bit=(raw.charCodeAt(n>>3)>>(7-(n%8)))&1;
    const xx=Math.floor(x0+(n%29+.5)*side/29),yy=Math.floor(y0+(Math.floor(n/29)+.5)*side/29);
    const rgba=g.getImageData(xx,yy,1,1).data,brightness=(rgba[0]+rgba[1]+rgba[2])/3;
    if((bit&&brightness>105)||(!bit&&brightness<180))errors++;
  }
  if(errors)throw Error(errors+" / 841 modules are incorrect in export");
  return "841 / 841 QR modules match fixture";
});
await check("可用时执行原生 QR 解码",async()=>{
  if(!("BarcodeDetector" in w)){skip++;pass--;return "SKIP: browser does not support BarcodeDetector; pixel matrix verified separately"}
  const bm=await w.createImageBitmap(qrOutput),cv=d.createElement("canvas");cv.width=cv.height=512;
  cv.getContext("2d").drawImage(bm,qrLayer.x,qrLayer.y,qrLayer.w,qrLayer.h,0,0,512,512);
  bm.close();const detector=new w.BarcodeDetector({formats:["qr_code"]});
  const codes=await detector.detect(cv);
  if(!codes.some(x=>x.rawValue==="QRPATCH-E2E-01"))throw Error("QR detector could not decode the generated fixture");
  return "QRPATCH-E2E-01 decoded";
});

await check("悬浮菜单：形状选择替代右侧重复设置",()=>{
  if(el("shapes")||el("toggleCrop"))throw Error("redundant shape/sidebar controls remain");
  if(!el("quickShape")||!el("shapePopover"))throw Error("context shape selector missing");
  const pop=el("shapePopover"),btn=x=>pop.querySelector('[data-shape="'+x+'"]');
  for(const mode of ["circle","rounded","square"]){
    el("quickShape").click();
    if(pop.hidden)throw Error("shape menu did not open");
    btn(mode).click();
    eq(layer().shape,mode,"mask "+mode);
    if(!pop.hidden)throw Error("shape menu did not dismiss");
    if(mode!=="rounded")near(layer().w,layer().h,"square aspect for "+mode);
  }
  return "3 shape modes";
});
await check("悬浮更多：复制、删除和白底入口",()=>{
  const before=state().layers.length;
  el("quickMore").click();
  if(el("morePopover").hidden)throw Error("more options did not open");
  el("quickDuplicate").click();
  eq(state().layers.length,before+1,"duplicated overlay");
  el("quickMore").click();
  el("quickBacking").click();
  el("quickMore").click();
  el("quickDelete").click();
  eq(state().layers.length,before,"removed duplicate");
  return "duplicate, backing toggle and remove";
});
await check("点击海报空白处显示背景悬浮工具条",()=>{
  const stage=el("stage"),canvas=el("canvas"),bounds=canvas.getBoundingClientRect();
  const event=new w.PointerEvent("pointerdown",{bubbles:true,pointerId:123,isPrimary:true,
    pointerType:"mouse",clientX:bounds.left+20,clientY:bounds.top+20,buttons:1});
  stage.dispatchEvent(event);
  if(!state().backgroundSelected)throw Error("background not selected");
  if(!el("quickTools").hidden)throw Error("layer toolbar still visible");
  if(el("bgTools").hidden)throw Error("background toolbar hidden");
  if(!el("bgReplace")||!el("bgAdjust")||!el("bgReset"))throw Error("missing background actions");
});
async function renderedPixels(){
  savedPNG=null;el("export").click();await until(()=>savedPNG);
  const bmp=await w.createImageBitmap(savedPNG),can=d.createElement("canvas");
  can.width=bmp.width;can.height=bmp.height;const g=can.getContext("2d",{willReadFrequently:true});
  g.drawImage(bmp,0,0);bmp.close();
  const b=state().background,a=state().layers.find(l=>l.kind==="qr" && l.visible);
  const ix=Math.floor(a.x+a.w*.5),iy=Math.floor(a.y+a.h*.5);
  return {
    bg:[...g.getImageData(50,50,1,1).data],
    qr:[...g.getImageData(ix,iy,1,1).data],
    dimensions:[can.width,can.height]
  };
}
await check("背景亮度对比度只改变底图、不影响 QR 图层及导出尺寸",async()=>{
  const before=await renderedPixels();
  el("bgAdjust").click();if(el("bgPopover").hidden)throw Error("adjustment panel hidden");
  const brightness=el("bgBrightness"),contrast=el("bgContrast");
  brightness.value="130";brightness.dispatchEvent(new w.Event("input",{bubbles:true}));
  brightness.dispatchEvent(new w.Event("change",{bubbles:true}));
  contrast.value="115";contrast.dispatchEvent(new w.Event("input",{bubbles:true}));
  contrast.dispatchEvent(new w.Event("change",{bubbles:true}));
  eq(state().bgEdits.brightness,130,"brightness");
  eq(state().bgEdits.contrast,115,"contrast");
  const after=await renderedPixels();
  if(before.bg.every((v,i)=>v===after.bg[i]))throw Error("background pixel did not change");
  if(before.qr.some((v,i)=>v!==after.qr[i]))throw Error("QR pixel changed when only background adjusted");
  eq(after.dimensions[0],1000,"export width");
  eq(after.dimensions[1],700,"export height");
  return "background adjusted, QR pixels unchanged";
});
await check("背景重置调色恢复原样",async()=>{
  el("bgReset").click();
  eq(state().bgEdits.brightness,100,"brightness reset");
  eq(state().bgEdits.contrast,100,"contrast reset");
  if(!el("bgPopover").hidden)throw Error("panel not closed");
});
await check("同尺寸更换背景保留所有二维码图层",async()=>{
  const before=state().layers.map(l=>({id:l.id,x:l.x,y:l.y,w:l.w,h:l.h}));
  const cv=d.createElement("canvas");cv.width=1000;cv.height=700;
  const g=cv.getContext("2d");g.fillStyle="#80a0bb";g.fillRect(0,0,1000,700);
  const blob=await new Promise(ok=>cv.toBlob(ok,"image/png"));
  const dt=new w.DataTransfer();
  dt.items.add(new w.File([blob],"replacement-background.png",{type:"image/png"}));
  el("bgInput").files=dt.files;
  el("bgInput").dispatchEvent(new w.Event("change",{bubbles:true}));
  await until(()=>el("docName").textContent==="replacement-background.png");
  const after=state().layers.map(l=>({id:l.id,x:l.x,y:l.y,w:l.w,h:l.h}));
  if(JSON.stringify(before)!==JSON.stringify(after))throw Error("layers or coordinates changed");
  if(!state().backgroundSelected)throw Error("background toolbar selection was not kept");
  return before.length+" layer(s) preserved";
});
await check("新建项目：重置画布与释放素材 URL",()=>{
  const revoke=w.URL.revokeObjectURL.bind(w.URL);let count=0;
  w.URL.revokeObjectURL=(url)=>{count++;return revoke(url)};
  w.confirm=()=>true;el("reset").click();
  const x=state();if(x.background||x.layers.length)throw Error("reset retained layers or background");
  if(count<2)throw Error("old image URLs were not revoked");
  return count+" object URLs released";
});
const failed=fail>0;document.querySelector("#summary").dataset.finished="true";document.querySelector("#summary").dataset.failed=String(fail);document.querySelector("#summary").style.borderColor=failed?"#e6aaa7":"#b3e3d1";say(failed?"fail":"pass",failed?"浏览器检查完成：存在失败项":"浏览器检查完成",pass+" PASS / "+fail+" FAIL / "+skip+" SKIP");
})().catch(e=>{document.querySelector("#summary").dataset.finished="true";document.querySelector("#summary").dataset.failed="1";document.querySelector("#summary").textContent="QA 未能完成";document.querySelector("#log").textContent=String(e.stack||e)});
</script></body></html>
