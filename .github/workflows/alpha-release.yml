name: QRPatch alpha release
on:
  push:
    paths:
      - ".github/workflows/alpha-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test prerequisites
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify transform geometry
        run: node tests/transform-contract.mjs

      - name: Verify real editor interactions and PNG export in Chromium
        run: python scripts/browser-qa.py

      - name: Verify mobile 390px/320px toolbar and PNG save workflow
        run: python scripts/mobile-qa.py

      - name: Capture REAL browser editor screenshot
        run: python scripts/capture-preview.py

      - name: Commit verified screenshot and updated README
        run: |
          test -s docs/assets/editor-preview.png
          test -s docs/assets/editor-mobile-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/editor-preview.png docs/assets/editor-mobile-preview.png README.md
          if git diff --staged --quiet; then
            echo "Screenshot already committed"
          else
            git commit -m "docs: add real QRPatch Studio screenshot to README"
            git push origin HEAD:main
          fi

      - name: Tag tested alpha snapshot
        run: |
          tag="v0.1.0-alpha.3"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
            echo "Alpha tag exists; retaining the existing immutable release"
          else
            git tag -a "$tag" -m "QRPatch alpha 0.1.0: browser QA and screenshot verified"
            git push origin "$tag"
          fi
